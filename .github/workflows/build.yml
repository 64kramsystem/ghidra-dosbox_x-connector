name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python -m pip install pytest
      - name: Download Ghidra 12.2
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          7z x -bd -o"$RUNNER_TEMP" "$RUNNER_TEMP/ghidra.zip"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"

      - run: python -m pytest
      - run: ./gradlew --no-daemon clean buildExtension
      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-dosbox_x-connector
          path: dist/*.zip
          if-no-files-found: error
